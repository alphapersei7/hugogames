<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Olympic War</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Layout: one arena. A 16:9 CGA-blue skyline on top, a control deck below tinted in the colour of whoever is throwing. Single committed dark look, a nod to QBasic. */
:root{
  --bg:#040a38;
  --sky:#0a1590;
  --panel:#071152;
  --panel-2:#0d1c74;
  --line:#2a3bb8;
  --ink:#eef0ff;
  --muted:#a3acea;
  --vic:#ff5c8d;
  --ale:#2fe0c6;
  --sun:#ffd23f;
  --boom:#ff3b2f;
  --pc:var(--vic);
  --display:'Silkscreen', ui-monospace, 'Courier New', monospace;
  --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--bg);color:var(--ink);height:100%}
body{font-family:var(--mono);font-size:14px;line-height:1.4;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  padding-block:10px}
button,input,select{touch-action:manipulation}
.deck,header{-webkit-user-select:none;user-select:none}
/* one screen: header and deck take what they need, the arena fills the rest at 16:9 */
.wrap{max-width:1180px;height:100%;margin:0 auto;display:flex;flex-direction:column;gap:8px}
header{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px}
.stage{flex:1 1 0;min-height:0;min-width:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
h1{font-family:var(--display);font-weight:700;font-size:clamp(18px,2.6vw,24px);margin:0;letter-spacing:.02em;text-wrap:balance;line-height:1.1}
h1{color:var(--sun);text-shadow:3px 3px 0 #000}
.ttl{display:flex;align-items:baseline;flex-wrap:wrap;column-gap:14px;row-gap:2px;min-width:0}
.vs{font-family:var(--display);font-size:13px;letter-spacing:.04em}
.vs .v{color:var(--vic)} .vs .a{color:var(--ale)} .vs .x{color:var(--muted);margin:0 .5em}
.mute{font:inherit;font-size:12px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.mute[aria-pressed=true]{color:var(--muted)}
.banner{background:rgba(4,10,56,.2);align-items:flex-end}
.storyctl{position:absolute;right:10px;bottom:10px;display:flex;gap:8px}
.storyctl button{font-family:var(--display);font-size:12px;color:var(--ink);background:rgba(4,10,56,.8);border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.storyctl #storySound{color:var(--sun);border-color:var(--sun)}
#storyHit{position:absolute;inset:0;cursor:pointer}
.banner .card{padding:12px 16px;gap:8px;max-width:380px}

.arena{position:relative;flex:none;width:100%;aspect-ratio:16/9;max-width:100%;border:2px solid var(--line);background:var(--sky);overflow:hidden}
canvas#arena{display:block;width:100%;height:100%;image-rendering:pixelated}

.overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(4,10,56,.55)}
.card{background:var(--panel);border:2px solid var(--line);box-shadow:6px 6px 0 #000;padding:14px 18px;max-width:460px;width:100%;display:flex;flex-direction:column;gap:10px;max-height:100%;overflow:auto}
.card h2{font-family:var(--display);font-size:18px;margin:0;font-weight:700;text-wrap:balance}
.card p{margin:0;color:var(--muted)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:0}
input[type=text],select{font:inherit;font-size:14px;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:7px 8px;border-radius:0;min-width:0;width:100%}
input[type=text]:focus-visible,select:focus-visible,button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--sun);outline-offset:2px}
#p1name{border-left:4px solid var(--vic)} #p2name{border-left:4px solid var(--ale)}
.btn{font-family:var(--display);font-size:15px;font-weight:700;letter-spacing:.04em;border:0;padding:11px 16px;cursor:pointer;background:var(--sun);color:#1a1200;box-shadow:4px 4px 0 #000;transition:transform .06s}
.btn:active{transform:translate(2px,2px);box-shadow:2px 2px 0 #000}
.btn:disabled{opacity:.4;cursor:not-allowed}
.banner .card{text-align:center;align-items:center}
.banner .big{font-family:var(--display);font-size:clamp(20px,4vw,30px);font-weight:700;line-height:1.1}
.keys{font-size:11px;color:var(--muted)}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);padding:0 4px;background:var(--panel-2)}

/* control deck */
.deck{flex:none;background:var(--panel);border:2px solid var(--line);border-top:4px solid var(--pc);display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);column-gap:16px;row-gap:6px;padding:8px 12px 10px;transition:border-color .2s}
.deck.locked{opacity:.75}
.who{grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.who b{font-family:var(--display);font-size:17px;color:var(--pc)}
.who span{color:var(--muted);font-size:12px}
.weapons{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;min-width:0}
.wpn{font:inherit;color:var(--ink);background:var(--panel-2);border:1px solid var(--line);padding:6px 8px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:2px;min-width:0;min-height:44px}
.wpn svg{width:100%;height:18px;color:var(--muted)}
.wpn .n{font-family:var(--display);font-size:12px;font-weight:700}
.wpn .kg{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.wpn[aria-pressed=true]{border-color:var(--pc);background:color-mix(in srgb,var(--pc) 16%,var(--panel-2));box-shadow:inset 0 0 0 1px var(--pc)}
.wpn[aria-pressed=true] svg{color:var(--pc)}
.wpn:disabled{cursor:not-allowed}
.effect{margin:0;color:var(--muted);font-size:12.5px;line-height:1.35;min-height:2.7em}
.effect b{color:var(--ink)}
.aim{display:flex;flex-direction:column;gap:6px;min-width:0}
.slider{display:grid;grid-template-columns:auto 1fr auto;align-items:center;column-gap:8px;row-gap:0}
.slider .lbl{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);grid-column:1/-1;display:flex;justify-content:space-between}
.slider .lbl output{font-family:var(--display);font-size:16px;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:0}
.step{font:inherit;font-weight:600;width:38px;height:34px;border:1px solid var(--line);background:var(--panel-2);color:var(--ink);cursor:pointer}
input[type=range]{width:100%;accent-color:var(--pc);min-width:0}
#throw{background:var(--pc);color:#06102e;width:100%;padding:9px 16px}
.left{display:flex;flex-direction:column;gap:6px;min-width:0}

/* short screens (iPad landscape with browser bars): tighten further */
@media (max-height:760px){
  header .vs{display:none}
  .effect{font-size:12px;min-height:2.6em}
  .wpn .kg{display:none}
  .slider .lbl output{font-size:14px}
}
/* phones: stack and let the page scroll instead */
@media (max-width:720px){
  body{overflow:auto;height:auto}
  .wrap{height:auto}
  .stage{flex:none;overflow:visible}
  .arena{width:100%}
  .deck{grid-template-columns:1fr}
  .weapons{grid-template-columns:repeat(2,minmax(0,1fr))}
  .row{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){ .btn,.deck{transition:none} }
</style>
</head>
<body>


<div class="wrap">
  <header>
    <div class="ttl">
      <h1>Olympic War</h1>
      <div class="vs"><span class="v" id="t1">Victoria</span><span class="x">v</span><span class="a" id="t2">Aleksandra</span></div>
    </div>
    <button class="mute" type="button" id="mute" aria-pressed="false">Sound on</button>
  </header>

  <div class="stage">
  <div class="arena">
    <canvas id="arena" width="960" height="540" aria-label="Skyline arena"></canvas>

    <div id="storyHit" aria-hidden="true"></div>
    <div class="storyctl" id="storyctl">
      <button type="button" id="storySound">Tap for sound</button>
      <button type="button" id="storySkip">Skip intro</button>
    </div>
    <div class="overlay" id="setup" hidden>
      <form class="card" id="setupForm">
        <h2>Olympic War</h2>
        <p>Take turns setting angle and velocity. Read the wind. First to the target score wins.</p>
        <div class="row">
          <label class="f">Thrower one<input type="text" id="p1name" value="Victoria" maxlength="14"></label>
          <label class="f">Thrower two<input type="text" id="p2name" value="Aleksandra" maxlength="14"></label>
        </div>
        <div class="row">
          <label class="f">Opponent
            <select id="mode"><option value="2p">Two players, one screen</option><option value="cpu">Thrower two is the computer</option></select>
          </label>
          <label class="f">First to
            <select id="target"><option>3</option><option selected>5</option><option>7</option><option>10</option></select>
          </label>
        </div>
        <label class="f">Gravity
          <select id="gravity">
            <option value="9.8" selected>Earth, 9.8 m/s²</option>
            <option value="3.7">Mars, 3.7 m/s²</option>
            <option value="1.6">Moon, 1.6 m/s²</option>
            <option value="24.8">Jupiter, 24.8 m/s²</option>
          </select>
        </label>
        <button class="btn" type="submit" id="start">Start the competition</button>
        <div class="keys"><kbd>←</kbd><kbd>→</kbd> angle · <kbd>↑</kbd><kbd>↓</kbd> velocity · <kbd>1</kbd>–<kbd>4</kbd> implement · <kbd>Space</kbd> throw</div>
      </form>
    </div>

    <div class="overlay banner" id="banner" hidden>
      <div class="card">
        <div class="big" id="bannerBig">Victoria scores</div>
        <p id="bannerSmall">3 – 1</p>
        <button class="btn" type="button" id="bannerBtn">Next round</button>
      </div>
    </div>
  </div>
  </div>

  <section class="deck" id="deck" aria-label="Throw controls">
    <div class="who"><b id="whoName">Victoria</b><span id="whoState">Pick an implement, set your angle and velocity.</span></div>
    <div class="left">
      <div class="weapons" role="group" aria-label="Implement">
        <button class="wpn" type="button" data-w="javelin" id="w-javelin" aria-pressed="true">
          <svg viewBox="0 0 60 22" aria-hidden="true"><line x1="4" y1="17" x2="56" y2="5" stroke="currentColor" stroke-width="2.5"/><path d="M56 5 l-7 0 l2 4 z" fill="currentColor"/><line x1="26" y1="12" x2="32" y2="10.6" stroke="currentColor" stroke-width="5"/></svg>
          <span class="n">Javelin</span><span class="kg">600 g · key 1</span>
        </button>
        <button class="wpn" type="button" data-w="discus" id="w-discus" aria-pressed="false">
          <svg viewBox="0 0 60 22" aria-hidden="true"><ellipse cx="30" cy="11" rx="17" ry="7" fill="none" stroke="currentColor" stroke-width="2.5"/><ellipse cx="30" cy="11" rx="5" ry="2.2" fill="currentColor"/></svg>
          <span class="n">Discus</span><span class="kg">1 kg · key 2</span>
        </button>
        <button class="wpn" type="button" data-w="hammer" id="w-hammer" aria-pressed="false">
          <svg viewBox="0 0 60 22" aria-hidden="true"><circle cx="44" cy="12" r="7" fill="currentColor"/><line x1="37" y1="12" x2="14" y2="8" stroke="currentColor" stroke-width="1.5" stroke-dasharray="2 2"/><path d="M14 4 l-6 4 l6 4" fill="none" stroke="currentColor" stroke-width="2.5"/></svg>
          <span class="n">Hammer</span><span class="kg">4 kg · key 3</span>
        </button>
        <button class="wpn" type="button" data-w="shot" id="w-shot" aria-pressed="false">
          <svg viewBox="0 0 60 22" aria-hidden="true"><circle cx="30" cy="11" r="8.5" fill="currentColor"/><circle cx="27" cy="8" r="2.2" fill="var(--panel-2)"/></svg>
          <span class="n">Shot put</span><span class="kg">4 kg · key 4</span>
        </button>
      </div>
      <p class="effect" id="effect"></p>
    </div>
    <div class="aim">
      <div class="slider">
        <div class="lbl"><span>Angle</span><output id="angleOut">45°</output></div>
        <button class="step" type="button" id="angleDn" aria-label="Lower angle">−</button>
        <input type="range" id="angle" min="0" max="90" value="45" aria-label="Angle">
        <button class="step" type="button" id="angleUp" aria-label="Raise angle">+</button>
      </div>
      <div class="slider">
        <div class="lbl"><span>Velocity</span><output id="powerOut">55</output></div>
        <button class="step" type="button" id="powerDn" aria-label="Less velocity">−</button>
        <input type="range" id="power" min="1" max="100" value="55" aria-label="Velocity">
        <button class="step" type="button" id="powerUp" aria-label="More velocity">+</button>
      </div>
      <button class="btn" type="button" id="throw">Throw javelin</button>
    </div>
  </section>
</div>

<script>
(() => {
const W = 960, H = 540;
const css = getComputedStyle(document.documentElement);
const C = k => css.getPropertyValue(k).trim();
const COL = { sky:C('--sky'), ink:C('--ink'), muted:C('--muted'), sun:C('--sun'), boom:C('--boom'), kit:[C('--vic'), C('--ale')] };
const BUILD = ['#a8a8a8', '#00a8a8', '#a80000', '#7a7ad8'];
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

const WEAPONS = {
  javelin:{ label:'javelin', grav:1.0,  wind:0.35, speed:1.12, blast:14, pierce:58,
    effect:'<b>Pierces.</b> Fast and flat, barely bothered by wind. Drives straight through the first wall it meets, then bursts in a small blast.' },
  discus: { label:'discus',  grav:0.68, wind:1.9,  speed:1.0,  blast:24, skips:2,
    effect:'<b>Glides and skips.</b> Floats on light gravity and skims off rooftops twice before it goes off. The wind pushes it hardest.' },
  hammer: { label:'hammer',  grav:1.15, wind:0.25, speed:0.92, blast:46,
    effect:'<b>Huge crater.</b> Slow and heavy on its wire. Lands with a blast big enough to take the corner off a building.' },
  shot:   { label:'shot',    grav:1.35, wind:0.08, speed:0.88, blast:19, bounces:4,
    effect:'<b>Bounces and rolls.</b> A solid iron ball that ignores the wind, bounces off walls and rolls along roofs before it detonates.' }
};

const cv = document.getElementById('arena'), ctx = cv.getContext('2d');
const dpr = Math.min(2, window.devicePixelRatio || 1);
cv.width = W*dpr; cv.height = H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
const bcv = document.createElement('canvas'); bcv.width = W; bcv.height = H;
const bctx = bcv.getContext('2d');
const mask = new Uint8Array(W*H);

const G = { names:['Victoria','Aleksandra'], score:[0,0], target:5, gravity:9.8, cpu:false,
  turn:0, starter:0, state:'setup', wind:0, players:[], proj:null, booms:[], parts:[],
  trails:[[],[]], sunShock:0, pending:null, shake:0, cpuShots:0, dead:-1,
  round:0, gravName:'Earth', ending:null, homeFade:0, introT:0, dancer:-1, muted:false, fw:{on:false,rockets:[],sparks:[],next:0} };
const set = [{angle:45,power:55,weapon:'javelin'},{angle:45,power:55,weapon:'javelin'}];

/* ---------- terrain ---------- */
function solid(x,y){ x|=0; y|=0; if(x<0||x>=W||y<0) return false; if(y>=H) return true; return mask[y*W+x]===1; }
function carve(cx,cy,r){
  const x0=Math.max(0,cx-r|0), x1=Math.min(W-1,cx+r|0), y0=Math.max(0,cy-r|0), y1=Math.min(H-1,cy+r|0), r2=r*r;
  for(let y=y0;y<=y1;y++) for(let x=x0;x<=x1;x++){ const dx=x-cx, dy=y-cy; if(dx*dx+dy*dy<=r2) mask[y*W+x]=0; }
  bctx.save(); bctx.globalCompositeOperation='destination-out'; bctx.beginPath(); bctx.arc(cx,cy,r,0,Math.PI*2); bctx.fill(); bctx.restore();
}
function newRound(){
  mask.fill(0); bctx.clearRect(0,0,W,H);
  const bs=[]; let x=0;
  const shape=Math.floor(Math.random()*4); // 0 random, 1 valley, 2 hill, 3 slope
  while(x<W){
    let w=48+Math.floor(Math.random()*46);
    if(W-x-w<50) w=W-x;
    const t=(x+w/2)/W; let base;
    if(shape===1) base=320-Math.sin(t*Math.PI)*150;
    else if(shape===2) base=170+Math.sin(t*Math.PI)*170;
    else if(shape===3) base=(Math.random()<.5?150+t*170:320-t*170);
    else base=240;
    const h=Math.max(90,Math.min(400,base+(Math.random()*2-1)*80));
    bs.push({x,w,top:H-Math.round(h)}); x+=w+2;
  }
  bs.forEach(b=>{
    bctx.fillStyle=BUILD[Math.floor(Math.random()*BUILD.length)];
    bctx.fillRect(b.x,b.top,b.w,H-b.top);
    for(let wy=b.top+6; wy<H-10; wy+=15) for(let wx=b.x+5; wx<b.x+b.w-6; wx+=10){
      bctx.fillStyle=Math.random()<.68?'#ffff55':'#555555'; bctx.fillRect(wx,wy,4,7);
    }
    for(let yy=b.top; yy<H; yy++){ const o=yy*W; for(let xx=b.x; xx<b.x+b.w && xx<W; xx++) mask[o+xx]=1; }
  });
  const n=bs.length;
  const li=1+(Math.random()<.5?0:1), ri=n-2-(Math.random()<.5?0:1);
  G.players=[li,ri].map(i=>({x:bs[i].x+(bs[i].w>>1), y:bs[i].top, throwT:0}));
  let w=Math.random()*2-1; if(Math.random()<.25) w*=.2;
  G.wind=Math.round(w*60);
  G.round++; G.dancer=-1; G.trails=[[],[]]; G.cpuShots=0; G.dead=-1; G.sunShock=0; G.booms=[]; G.parts=[]; G.proj=null;
}

/* ---------- sound ---------- */
let ac=null;
function audio(){ try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state!=='running') ac.resume();
  const b=ac.createBuffer(1,1,22050), s=ac.createBufferSource(); s.buffer=b; s.connect(ac.destination); s.start(0); }catch(e){ ac=null; } }
// unlock sound on the very first touch, click or key anywhere on the page
['pointerdown','touchend','keydown'].forEach(ev=>window.addEventListener(ev,()=>{ if(!ac||ac.state!=='running') audio(); },{capture:true,passive:true}));
function tone(f0,f1,dur,type='square',vol=.06){ if(!ac||G.muted) return; const o=ac.createOscillator(), g=ac.createGain(); o.type=type; o.frequency.setValueAtTime(f0,ac.currentTime); o.frequency.exponentialRampToValueAtTime(f1,ac.currentTime+dur); g.gain.setValueAtTime(vol,ac.currentTime); g.gain.exponentialRampToValueAtTime(.0001,ac.currentTime+dur); o.connect(g).connect(ac.destination); o.start(); o.stop(ac.currentTime+dur); }
function noise(dur,vol){ if(!ac||G.muted) return; const b=ac.createBuffer(1,ac.sampleRate*dur,ac.sampleRate), d=b.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/d.length,2); const s=ac.createBufferSource(), g=ac.createGain(); s.buffer=b; g.gain.value=vol; s.connect(g).connect(ac.destination); s.start(); }
const sfx={ throw:()=>tone(300,900,.18,'triangle',.05), thud:()=>tone(160,60,.08,'square',.05), boom:r=>noise(.25+r/80,.25+r/200), pop:()=>noise(.35,.07) };
function nf(n){ const m=n.match(/^([A-G])(#?)(\d)$/); const st={C:0,D:2,E:4,F:5,G:7,A:9,B:11}[m[1]]+(m[2]?1:0); return 440*Math.pow(2,(12*(+m[3]+1)+st-69)/12); }
let songNodes=[];
function stopSong(){ songNodes.forEach(o=>{ try{o.stop();}catch(e){} }); songNodes=[]; }
function playSong(song){
  stopSong(); if(!ac||G.muted) return;
  const b=60/song.bpm, t0=ac.currentTime+.05;
  song.voices.forEach(v=>{ let t=t0;
    v.notes.trim().split(/\s+/).forEach(tok=>{ const [n,l]=tok.split(':'), d=(+l||1)*b;
      if(n!=='R'){ const o=ac.createOscillator(), g=ac.createGain(); o.type=v.wave; o.frequency.value=nf(n);
        g.gain.setValueAtTime(0,t); g.gain.linearRampToValueAtTime(v.vol,t+.01); g.gain.setValueAtTime(v.vol,t+d*.7); g.gain.linearRampToValueAtTime(0,t+d*.95);
        o.connect(g).connect(ac.destination); o.start(t); o.stop(t+d); songNodes.push(o); }
      t+=d; }); });
}
const SONGS={
  title:{bpm:260, voices:[
    {wave:'square',  vol:.05, notes:'C5 C5 C5 G5:3 R F5 E5 D5 C6:3 G5 E5 G5 C6:6'},
    {wave:'square',  vol:.025,notes:'E4 E4 E4 C5:3 R A4 G4 F4 E5:3 C5 G4 C5 E5:6'},
    {wave:'triangle',vol:.1,  notes:'C3:4 C3:2 R:2 F2:4 G2:4 C3:6'} ]},
  intro:{bpm:320, voices:[
    {wave:'square',  vol:.05, notes:'G4 C5 E5 G5 R E5 G5:3 C6:4'},
    {wave:'triangle',vol:.09, notes:'C3:2 G2:2 C3:2 E3:2 G3:5'} ]},
  point:{bpm:360, voices:[

/* ---------- throwing ---------- */
// Throw speed and wind scale with gravity so every planet stays playable:
// on the Moon throws are gentler and floatier, on Jupiter they're harder and faster.
function phys(){ const k=G.gravity/9.8; return { vs:Math.pow(k,0.42), ws:k }; }
function launch(p){
  if(G.state!=='aim'||G.turn!==p) return;
  const s=set[p], wp=WEAPONS[s.weapon], pl=G.players[p], dir=p===0?1:-1;
  const a=s.angle*Math.PI/180, v=s.power*7*wp.speed*phys().vs;
  G.proj={p, wp, key:s.weapon, x:pl.x+dir*10, y:pl.y-36, vx:Math.cos(a)*v*dir, vy:-Math.sin(a)*v,
    spin:0, pierce:wp.pierce||0, piercing:false, skips:wp.skips||0, bounces:wp.bounces||0, age:0};
  G.trails[p]=[]; pl.throwT=.45; G.state='flight'; sfx.throw(); syncUI();
}
function stepProj(dt){
  const P=G.proj, wp=P.wp;
  P.vx+=G.wind*wp.wind*phys().ws*dt; P.vy+=G.gravity*30*wp.grav*dt;
  const px=P.x, py=P.y; P.x+=P.vx*dt; P.y+=P.vy*dt; P.age+=dt;
  P.spin+=dt*(P.key==='hammer'?14:P.key==='discus'?22:P.key==='shot'?P.vx/8:0);
  const tr=G.trails[P.p]; if(!tr.length || Math.hypot(tr[tr.length-1][0]-P.x, tr[tr.length-1][1]-P.y)>9) tr.push([P.x,P.y]);
  for(let i=0;i<2;i++){
    if(i===P.p && P.age<.12) continue;
    const pl=G.players[i];
    if(P.x>pl.x-10 && P.x<pl.x+10 && P.y>pl.y-40 && P.y<pl.y+1){ explode(P.x,P.y,Math.max(wp.blast,22)); return; }
  }
  if(Math.hypot(P.x-W/2,P.y-48)<26) G.sunShock=1;
  if(P.x<-80||P.x>W+80||P.y>H+20){ G.proj=null; G.state='boom'; G.pending={victims:[],thrower:P.p}; return; }
  const hit=solid(P.x,P.y);
  if(P.piercing){
    if(hit){ carve(P.x,P.y,4.5); debris(P.x,P.y,1); P.pierce-=Math.hypot(P.x-px,P.y-py); if(P.pierce<=0) explode(P.x,P.y,wp.blast); }
    else { P.piercing=false; P.pierce=0; }
    return;
  }
  if(!hit) return;
  if(P.pierce>0){ P.piercing=true; carve(P.x,P.y,4.5); sfx.thud(); return; }
  if(P.skips>0 || P.bounces>0){
    const top = solid(px,P.y) || !solid(P.x,py);
    P.x=px; P.y=py;
    if(P.skips>0){
      if(top && P.vy>0){ P.vy=-P.vy*.5; P.vx*=.88; P.skips--; carve(px,py+6,7); debris(px,py,4); sfx.thud(); return; }
      explode(px,py,wp.blast); return;
    }
    if(top){ P.vy=-P.vy*.45; P.vx*=.82; } else { P.vx=-P.vx*.55; }
    P.bounces--; carve(px+(top?0:Math.sign(-P.vx)*4), py+(top?5:0), 5); debris(px,py,3); sfx.thud();
    if(P.bounces<=0 || Math.hypot(P.vx,P.vy)<70*phys().vs) explode(px,py,wp.blast);
    return;
  }
  explode(P.x,P.y,wp.blast);
}
function circleRect(cx,cy,r,x,y,w,h){ const nx=Math.max(x,Math.min(cx,x+w)), ny=Math.max(y,Math.min(cy,y+h)); return (cx-nx)**2+(cy-ny)**2<=r*r; }
function debris(x,y,n){ for(let i=0;i<n;i++) G.parts.push({x,y,vx:(Math.random()*2-1)*120,vy:-Math.random()*160,life:.6+Math.random()*.4,c:Math.random()<.5?'#ffff55':'#a8a8a8'}); }
function explode(x,y,r){
  const P=G.proj; G.proj=null;
  carve(x,y,r);
  const victims=[];
  G.players.forEach((pl,i)=>{ if(circleRect(x,y,r*.9,pl.x-9,pl.y-38,18,38)) victims.push(i); });
  G.booms.push({x,y,r,t:0,dur:.5});
  victims.forEach(i=>{ const pl=G.players[i]; G.booms.push({x:pl.x,y:pl.y-20,r:44,t:-.08,dur:.8}); carve(pl.x,pl.y-14,26); debris(pl.x,pl.y-20,22); });
  debris(x,y,Math.min(30,r/1.5|0));
  if(!reduceMotion) G.shake=Math.min(10,r/5+(victims.length?6:0));
  sfx.boom(r + (victims.length?40:0));
  G.pending={victims,thrower:P.p}; G.state='boom';
}
function resolve(){
  const {victims,thrower}=G.pending; G.pending=null;
  const other=1-thrower;
  if(!victims.length){ G.turn=other; G.state='aim'; syncUI(); maybeCPU(); return; }
  const scorer = victims.includes(other) ? thrower : other;
  const hitWho = victims.includes(other) ? other : thrower;
  G.dead=hitWho; G.score[scorer]++; G.state='roundover';
  const n=G.names, s=G.score;
  const won = s[scorer]>=G.target;
  document.getElementById('bannerBig').textContent = won ? `${n[scorer]} wins` : (scorer===thrower ? `${n[scorer]} scores` : `${n[thrower]} hit herself`);
  document.getElementById('bannerBig').style.color = COL.kit[won||scorer===thrower?scorer:thrower];
  document.getElementById('bannerSmall').textContent = `${n[0]} ${s[0]} – ${s[1]} ${n[1]}` + (won ? '' : (scorer!==thrower ? `. Point to ${n[scorer]}.` : ''));
  document.getElementById('bannerBtn').textContent = won ? 'Play again' : 'Next round';
  G.dancer=scorer;
  if(won){ G.state='gameover'; playSong(SONGS.anthem); G.fw.on=true; G.fw.next=.4; startEnding(scorer); }
  else playSong(SONGS.point);
  if(!won) setTimeout(()=>{ if(G.state==='roundover'){ document.getElementById('banner').hidden=false; document.getElementById('bannerBtn').focus({preventScroll:true}); } }, won?3000:2600);
  syncUI();
}
function nextRound(){
  document.getElementById('banner').hidden=true;
  G.fw.on=false; G.fw.rockets=[]; G.fw.sparks=[]; stopSong();
  if(G.state==='gameover'){ document.getElementById('setup').hidden=false; G.state='setup'; newRound(); G.dancer=-1; syncUI(); return; }
  G.starter=1-G.starter; G.turn=G.starter; newRound(); startIntro();
}
function startIntro(){ G.state='intro'; G.introT=2.5; playSong(SONGS.intro); syncUI(); }
function endIntro(){ G.state='aim'; syncUI(); maybeCPU(); }
function fwBurst(x,y,c){
  const n=reduceMotion?24:46;
  for(let i=0;i<n;i++){ const a=i/n*Math.PI*2+Math.random()*.2, sp=70+Math.random()*120;
    G.fw.sparks.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1.1+Math.random()*.5,max:1.6,c:Math.random()<.2?'#ffffff':c}); }
  sfx.pop();
}
function stepFireworks(dt){
  const F=G.fw;
  if(F.on){ F.next-=dt; if(F.next<=0){ F.next=reduceMotion?.9:.35+Math.random()*.35;
    const pal=G.dancer<0?[COL.kit[0],COL.kit[1],COL.sun,'#ffffff']:[COL.kit[G.dancer],COL.sun,COL.kit[G.dancer],'#ffffff'];
    const c=pal[Math.random()*4|0];
    F.rockets.push({x:120+Math.random()*(W-240), y:H, vy:-(340+Math.random()*130), vx:(Math.random()*2-1)*30, c}); } }
  F.rockets.forEach(r=>{ r.vy+=160*dt; r.x+=r.vx*dt; r.y+=r.vy*dt; if(r.vy>-50){ r.dead=true; fwBurst(r.x,r.y,r.c); } });
  F.rockets=F.rockets.filter(r=>!r.dead);
  F.sparks.forEach(s=>{ s.vy+=70*dt; s.vx*=.985; s.x+=s.vx*dt; s.y+=s.vy*dt; s.life-=dt; });
  F.sparks=F.sparks.filter(s=>s.life>0);
}

/* ---------- computer thrower ---------- */
function simulate(p,angle,power,key){
  const wp=WEAPONS[key], pl=G.players[p], tg=G.players[1-p], dir=p===0?1:-1;
  let x=pl.x+dir*10, y=pl.y-36; const a=angle*Math.PI/180, v=power*7*wp.speed*phys().vs;
  let vx=Math.cos(a)*v*dir, vy=-Math.sin(a)*v; const g=G.gravity*30*wp.grav, ax=G.wind*wp.wind*phys().ws, dt=1/90;
  let best=1e9;
  for(let i=0;i<3600;i++){
    vx+=ax*dt; vy+=g*dt; x+=vx*dt; y+=vy*dt;
    const d=Math.hypot(x-tg.x,y-(tg.y-18)); if(d<best) best=d;
    if(Math.abs(x-pl.x)<14 && Math.abs(y-(pl.y-18))<22 && i>12) return 1e9;
    if(x<-60||x>W+60||y>H) break;
    if(solid(x,y)){ best=Math.min(best,d-wp.blast*.8); break; }
  }
  return best;
}
function gauss(){ return (Math.random()+Math.random()+Math.random()-1.5)/0.5; }
function maybeCPU(){
  if(!(G.cpu && G.turn===1 && G.state==='aim')) return;
  document.getElementById('whoState').textContent='Sizing up the throw…';
  setTimeout(()=>{
    if(!(G.cpu && G.turn===1 && G.state==='aim')) return;
    let pick=null;
    for(const key of Object.keys(WEAPONS)){
      for(let a=12;a<=86;a+=2) for(let pw=18;pw<=100;pw+=2){
        const d=simulate(1,a,pw,key)+(Math.random()*6);
        if(!pick||d<pick.d) pick={d,a,pw,key};
      }
    }
    const n=G.cpuShots++, k=1/(1+0.75*n);
    const s=set[1];
    s.weapon=pick.key;
    s.angle=Math.max(0,Math.min(90,Math.round(pick.a+gauss()*7*k)));
    s.power=Math.max(1,Math.min(100,Math.round(pick.pw+gauss()*6*k)));
    syncUI();
    setTimeout(()=>launch(1),650);
  },500);
}

/* ---------- drawing ---------- */
function drawSun(){
  const x=W/2, y=48;
  ctx.strokeStyle=COL.sun; ctx.lineWidth=2;
  for(let i=0;i<16;i++){ const a=i/16*Math.PI*2, r1=24, r2=i%2?32:36; ctx.beginPath(); ctx.moveTo(x+Math.cos(a)*r1,y+Math.sin(a)*r1); ctx.lineTo(x+Math.cos(a)*r2,y+Math.sin(a)*r2); ctx.stroke(); }
  ctx.fillStyle=COL.sun; ctx.beginPath(); ctx.arc(x,y,20,0,Math.PI*2); ctx.fill();
  ctx.fillStyle=COL.sky; ctx.fillRect(x-8,y-7,4,4); ctx.fillRect(x+4,y-7,4,4);
  ctx.strokeStyle=COL.sky; ctx.lineWidth=2.5;
  if(G.sunShock){ ctx.beginPath(); ctx.arc(x,y+7,5,0,Math.PI*2); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(x,y+2,9,.2*Math.PI,.8*Math.PI); ctx.stroke(); }
}
function drawImplement(key,x,y,ang,spin,scale=1){
  ctx.save(); ctx.translate(x,y); ctx.scale(scale,scale);
  if(key==='javelin'){ ctx.rotate(ang); ctx.strokeStyle='#f2e6c9'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-15,0); ctx.lineTo(13,0); ctx.stroke(); ctx.fillStyle='#d9dde8'; ctx.beginPath(); ctx.moveTo(17,0); ctx.lineTo(11,-2); ctx.lineTo(11,2); ctx.fill(); ctx.strokeStyle='#ff5c8d'; ctx.lineWidth=3; ctx.beginPath(); ctx.moveTo(-2,0); ctx.lineTo(3,0); ctx.stroke(); }
  else if(key==='discus'){ ctx.rotate(ang); ctx.scale(1,Math.max(.25,Math.abs(Math.cos(spin)))); ctx.fillStyle='#d9dde8'; ctx.beginPath(); ctx.arc(0,0,7,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#333'; ctx.beginPath(); ctx.arc(0,0,2.5,0,Math.PI*2); ctx.fill(); }
  else if(key==='hammer'){ ctx.rotate(spin); ctx.strokeStyle='#d9dde8'; ctx.lineWidth=1; ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(16,0); ctx.stroke(); ctx.strokeStyle='#ffd23f'; ctx.lineWidth=2; ctx.strokeRect(15,-3,4,6); ctx.fillStyle='#3a3f4a'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#8a90a0'; ctx.fillRect(-3,-4,2,2); }
  else { ctx.fillStyle='#3a3f4a'; ctx.beginPath(); ctx.arc(0,0,6,0,Math.PI*2); ctx.fill(); ctx.fillStyle='#9aa0b0'; ctx.beginPath(); ctx.arc(-2+Math.cos(spin)*1.5,-2,1.8,0,Math.PI*2); ctx.fill(); }
  ctx.restore();
}
function drawAthlete(i){
  if(G.dead===i) return;
  const pl=G.players[i], d=i===0?1:-1, kit=COL.kit[i], skin=i===0?'#e9b48f':'#f1c9a5';
  const dancing=G.dancer===i, t=performance.now()/1000;
  const hop=dancing?Math.abs(Math.sin(t*7))*(reduceMotion?3:9):0;
  const x=(pl.x+(dancing?Math.sin(t*3.5)*3:0))|0, y=(pl.y-hop)|0;
  ctx.fillStyle=skin; ctx.fillRect(x-5,y-13,3,13); ctx.fillRect(x+2,y-13,3,13);
  ctx.fillStyle='#1b1f3a'; ctx.fillRect(x-6,y-18,12,6);
  ctx.fillStyle=kit; ctx.fillRect(x-6,y-30,12,13);
  ctx.fillStyle='#fff'; ctx.fillRect(x-3,y-26,6,4);
  ctx.fillStyle=skin; ctx.beginPath(); ctx.arc(x,y-35,5,0,Math.PI*2); ctx.fill();
  if(i===0){ ctx.fillStyle='#5a2e1a'; ctx.fillRect(x-5,y-41,10,4); ctx.fillRect(x-d*7,y-39,3,8); }
  else { ctx.fillStyle='#f3d36b'; ctx.fillRect(x-5,y-41,10,3); ctx.beginPath(); ctx.arc(x,y-43,3,0,Math.PI*2); ctx.fill(); }
  ctx.strokeStyle=skin; ctx.lineWidth=3; ctx.lineCap='round';
  if(dancing){
    const up=Math.sin(t*7)>0;
    ctx.beginPath(); ctx.moveTo(x-5,y-28); ctx.lineTo(x-10,up?y-44:y-34); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(x+5,y-28); ctx.lineTo(x+10,up?y-34:y-44); ctx.stroke();
    ctx.lineCap='butt';
    ctx.fillStyle=kit; ctx.font='700 11px Silkscreen, monospace'; ctx.textAlign='center'; ctx.textBaseline='alphabetic';
    if(Math.sin(t*3.5)>-.3) ctx.fillText('YES!', x, pl.y-58-hop);

  }
  ctx.beginPath(); ctx.moveTo(x-d*5,y-28); ctx.lineTo(x-d*8,y-19); ctx.stroke();
  const aiming = G.turn===i && (G.state==='aim'||G.state==='setup');

  if(pl.throwT>0){ hx=x+d*12; hy=y-40; } else if(aiming){ hx=x-d*2; hy=y-42; } else { hx=x+d*8; hy=y-19; }
  ctx.lineTo(hx,hy); ctx.stroke(); ctx.lineCap='butt';
  if(aiming && G.state==='aim'){ const s=set[i]; const a=s.angle*Math.PI/180; drawImplement(s.weapon,hx,hy-2, i===0?-a:Math.PI+a, 0, .85); }

}

function wrapLines(text,maxW){ const out=[]; let line=''; text.split(' ').forEach(w=>{ const t=line?line+' '+w:w; if(ctx.measureText(t).width>maxW && line){ out.push(line); line=w; } else line=t; }); if(line) out.push(line); return out; }

/* ---------- loop ---------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(1/30,(now-last)/1000); last=now;
  G.players.forEach(p=>{ if(p.throwT>0) p.throwT-=dt; });
  if(G.state==='flight' && G.proj){ const n=6; for(let i=0;i<n && G.proj;i++) stepProj(dt/n); }
  G.booms.forEach(b=>b.t+=dt); G.booms=G.booms.filter(b=>b.t<b.dur);
  G.parts.forEach(p=>{ p.vy+=400*dt; p.x+=p.vx*dt; p.y+=p.vy*dt; p.life-=dt; }); G.parts=G.parts.filter(p=>p.life>0);

  if(G.state==='intro'){ G.introT-=dt; if(G.introT<=0) endIntro(); }
  if(G.state==='story') stepStory(dt);
  if(G.state==='logo') stepLogo(dt);
  stepFireworks(dt);
  if(G.ending) stepEnding(dt);
  if(G.homeFade>0) G.homeFade=Math.max(0,G.homeFade-dt/.8);

}

    case ' ': case 'Enter': if(e.target.tagName==='BUTTON' && e.target.id!=='throw') { used=false; break; } audio(); launch(G.turn); break;
    default: used=false;
  }
  if(used) e.preventDefault();
});

newRound();
// Start straight into the intro when the browser already allows sound; otherwise wait for one tap so the intro plays with sound.
try{ ac=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ ac=null; }
if(ac && ac.state==='running') startLogo();
else { G.state='press'; $('storyctl').hidden=false; $('storyHit').hidden=false; syncUI(); }
$('storySound').hidden=true;
requestAnimationFrame(frame);

/* fit the 16:9 arena into whatever space the header and controls leave; re-run on every rotate/resize */
const stage=document.querySelector('.stage'), arenaEl=document.querySelector('.arena');
function fitArena(){
  if(window.innerWidth<=720){ arenaEl.style.width=''; arenaEl.style.height=''; return; }
  const r=stage.getBoundingClientRect();
  const w=Math.max(160,Math.floor(Math.min(r.width, r.height*16/9)));
  arenaEl.style.width=w+'px'; arenaEl.style.height=Math.round(w*9/16)+'px';
}
let fitTimers=[];
function refit(){ fitArena(); fitTimers.forEach(clearTimeout); fitTimers=[60,250,600,1000].map(d=>setTimeout(fitArena,d)); }
try{ new ResizeObserver(fitArena).observe(stage); }catch(e){}
window.addEventListener('resize',refit);
window.addEventListener('orientationchange',refit);
if(window.visualViewport) visualViewport.addEventListener('resize',refit);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(refit);
refit();
})();
</script>
